# Blueprint for Render (API). Secrets must still be set in the dashboard.
# Use branch `deployment` when connecting the service in the UI.

services:
  - type: web
    name: archivex-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: archivex
      - key: TRUST_PROXY
        value: "1"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
